[package]
name = "recall"
version = "0.1.0"
description = "One task list, on every screen you use."
authors = ["Swapnil"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "recall_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Win32 calls the Tauri API does not wrap: pushing the widget to the bottom of
# the z-order so it sits on the desktop rather than over the user's work.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }

# Desktop-only plugins. Guarded so the crate still resolves if this is ever
# built for a mobile target.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"

[profile.release]
# The widget runs all day, so a smaller, faster binary is worth a slower build.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
