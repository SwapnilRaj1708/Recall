<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover lets the app paint under the status bar and the
      gesture pill; the safe-area insets below keep content out from under them.
      user-scalable=no because pinch-zooming a task list is never intentional.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Recall</title>
    <script src="/theme-bootstrap.js"></script>
    <style>
      html,
      body,
      #root {
        height: 100%;
      }

      body {
        margin: 0;
        background: #f4f4f6;
        /* A stray horizontal scroll on a touch screen feels like a broken app. */
        overflow-x: hidden;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior-y: contain;
      }

      #root {
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
        box-sizing: border-box;
      }

      :root[data-theme='dark'] body,
      :root[data-theme='system'][data-system-dark='true'] body {
        background: #0e0e11;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
